<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultimate Diamond &mdash; Rolex Reference Catalog</title>
<style>
  :root{
    --green:#0b3d2e; --green-2:#12503b; --gold:#b6924f; --gold-soft:#c9a862;
    --ink:#1a2420; --muted:#6b7772; --line:#e3e7e4; --bg:#f4f6f4; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:50;background:linear-gradient(160deg,var(--green),var(--green-2));color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
  .bar{max-width:1400px;margin:0 auto;padding:16px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;line-height:1.05}
  .brand .co{font-family:Georgia,"Times New Roman",serif;font-size:22px;letter-spacing:.5px}
  .brand .sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-soft);margin-top:3px}
  .search{flex:1;min-width:260px;position:relative}
  .search input{width:100%;padding:13px 16px 13px 44px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-size:16px;outline:none}
  .search input::placeholder{color:rgba(255,255,255,.7)}
  .search input:focus{background:rgba(255,255,255,.2);border-color:var(--gold-soft)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.8}
  .clearbtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:.7;display:none}
  .count{font-size:13px;color:var(--gold-soft);white-space:nowrap}
  .printbtn{background:var(--gold);color:#20180a;border:none;padding:11px 16px;border-radius:9px;font-weight:700;font-size:13px;letter-spacing:.5px;cursor:pointer;text-transform:uppercase}
  .printbtn:hover{background:var(--gold-soft)}

  .chips{max-width:1400px;margin:0 auto;padding:12px 22px 4px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;transition:.12s}
  .chip .c{color:var(--muted);font-size:11px;margin-left:5px}
  .chip:hover{border-color:var(--gold)}
  .chip.active{background:var(--green);color:#fff;border-color:var(--green)}
  .chip.active .c{color:var(--gold-soft)}

  main{max-width:1400px;margin:0 auto;padding:18px 22px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .cardwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
  .cardwrap:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(11,61,46,.14);border-color:var(--gold-soft)}
  .imgbox{background:#fff;aspect-ratio:1240/1634;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .imgbox img{width:100%;height:100%;object-fit:cover;object-position:top}
  .meta{padding:12px 14px 14px;border-top:1px solid var(--line)}
  .meta .ref{font-family:Georgia,serif;font-size:19px;font-weight:700;letter-spacing:.5px}
  .meta .coll{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin-top:3px}
  .meta .nv{font-size:12px;color:var(--muted);margin-top:6px}
  .noresults{text-align:center;color:var(--muted);padding:80px 20px;font-size:18px;display:none}

  .modal{position:fixed;inset:0;background:rgba(8,20,15,.92);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
  .modal.open{display:flex}
  .modal .inner{max-width:min(94vw,900px);max-height:94vh;overflow:auto;background:#fff;border-radius:14px;position:relative}
  .modal img{width:100%;display:block}
  .modal .close{position:fixed;top:18px;right:22px;background:var(--gold);color:#20180a;border:none;width:44px;height:44px;border-radius:50%;font-size:24px;cursor:pointer;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.3)}

  @media print{
    header,.chips,.printbtn,.modal,.noresults{display:none !important}
    body{background:#fff}
    main{max-width:none;padding:0}
    .grid{display:block}
    .cardwrap{break-inside:avoid;page-break-inside:avoid;border:none;border-radius:0;box-shadow:none;margin:0 0 8mm;display:block}
    .cardwrap:nth-child(2n){page-break-after:always}
    .imgbox{aspect-ratio:auto}
    .imgbox img{object-fit:contain;height:auto}
    .meta{border-top:1px solid #ccc}
    @page{margin:12mm}
  }
</style>
</head>

</main>

const CHIPS  = [{"key": "datejust", "name": "Datejust", "n": 32}, {"key": "day-date", "name": "Day-Date", "n": 21}, {"key": "lady-datejust", "name": "Lady-Datejust", "n": 16}, {"key": "oyster-perpetual", "name": "Oyster Perpetual", "n": 16}, {"key": "1908", "name": "Perpetual 1908", "n": 3}, {"key": "air-king", "name": "Air-King", "n": 1}, {"key": "cosmograph-daytona", "name": "Cosmograph Daytona", "n": 16}, {"key": "submariner", "name": "Submariner", "n": 7}, {"key": "gmt-master-ii", "name": "GMT-Master II", "n": 8}, {"key": "sea-dweller", "name": "Sea-Dweller", "n": 2}, {"key": "deepsea", "name": "Deepsea", "n": 3}, {"key": "explorer", "name": "Explorer", "n": 3}, {"key": "explorer-ii", "name": "Explorer II", "n": 1}, {"key": "yacht-master", "name": "Yacht-Master", "n": 9}, {"key": "yacht-master-ii", "name": "Yacht-Master II", "n": 2}, {"key": "sky-dweller", "name": "Sky-Dweller", "n": 7}, {"key": "land-dweller", "name": "Land-Dweller", "n": 10}];
const TOTAL_MODELS = 157, TOTAL_VARS = 1465;

function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
MODELS.forEach(m=>{ m._hay = norm(m.base)+" "+norm(m.coll)+" "+m.collName.toLowerCase()+" "+m.vars.map(norm).join(" "); });

const grid=document.getElementById("grid");
const countEl=document.getElementById("count");
const noRes=document.getElementById("noresults");
const qEl=document.getElementById("q");
const clearBtn=document.getElementById("clear");
let activeColl="all";

const chipsEl=document.getElementById("chips");
function mkChip(key,name,n){
  const b=document.createElement("button");
  b.className="chip"+(key===activeColl?" active":"");
  b.dataset.key=key;
  b.innerHTML=name+' <span class="c">'+n+'</span>';
  b.onclick=()=>{activeColl=key;[...chipsEl.children].forEach(c=>c.classList.toggle("active",c.dataset.key===key));render();};
  return b;
}
chipsEl.appendChild(mkChip("all","All Models",TOTAL_MODELS));
CHIPS.forEach(c=>chipsEl.appendChild(mkChip(c.key,c.name,c.n)));

function render(){
  const raw=qEl.value.trim();
  const q=norm(raw);
  clearBtn.style.display=raw?"block":"none";
  const frag=document.createDocumentFragment();
  let shown=0;
  for(const m of MODELS){
    if(activeColl!=="all" && m.coll!==activeColl) continue;
    if(q && m._hay.indexOf(q)===-1) continue;
    shown++;
    const w=document.createElement("div");
    w.className="cardwrap";
    w.onclick=()=>openModal(m);
    w.innerHTML=
      '<div class="imgbox"><img loading="lazy" src="'+m.card+'" alt="'+m.base+'"></div>'+
      '<div class="meta"><div class="ref">'+m.base+'</div>'+
      '<div class="coll">'+m.collName+'</div>'+
      '<div class="nv">'+m.count+' variation'+(m.count===1?"":"s")+'</div></div>';
    frag.appendChild(w);
  }
  grid.innerHTML="";
  grid.appendChild(frag);
  noRes.style.display=shown?"none":"block";
  countEl.textContent=shown+" model"+(shown===1?"":"s")+(activeColl==="all"&&!q ? " · "+TOTAL_VARS+" variations" : "");
}

const modal=document.getElementById("modal"), mimg=document.getElementById("mimg");
function openModal(m){mimg.src=m.card;mimg.alt=m.base;modal.classList.add("open");document.body.style.overflow="hidden";}
function closeModal(){modal.classList.remove("open");document.body.style.overflow="";}
document.getElementById("mclose").onclick=closeModal;
modal.onclick=e=>{if(e.target===modal)closeModal();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

qEl.addEventListener("input",render);
clearBtn.onclick=()=>{qEl.value="";qEl.focus();render();};
render();
</script>
